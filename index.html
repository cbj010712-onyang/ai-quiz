<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI·코딩 퀴즈 챌린지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=20261126a">
</head>
<body>
<main id="app" aria-live="polite"><p class="loading">불러오는 중…</p></main>
<div id="dock"></div>
<div id="layer"></div>

<script src="config.js?v=20261126a"></script>
<script src="js/common.js?v=20261126a"></script>
<script src="js/mock.js?v=20261126a"></script>
<script>
/* =====================================================================
   학생 퀴즈 화면
   - 정답은 서버에만 있어요. 답을 보내면 서버가 채점하고 시간도 서버가 재요.
   - 문제는 학생마다 랜덤으로 뽑아요 (스테이지마다 소주제가 겹치지 않게). 보기 순서는 띄울 때마다 섞여요.
   - 새로고침해도 같은 학년·반·번호·이름이면 하던 곳부터 이어서 해요 (같은 문제). 다시 뽑으려면 관리자 페이지에서 그 기록을 지워요.
   ===================================================================== */
const DASHBOARD_URL = 'dashboard.html';
const TURTLE = 'img/mascot.png';   // 학교 거북이 (휴대폰에 홍보 문구)
const $app = document.getElementById('app'), $dock = document.getElementById('dock'), $layer = document.getElementById('layer');

let S = { screen: 'loading', settings: null, items: [], i: 0, combo: 0, maxCombo: 0, checked: false, err: '', busy: false, fx: '', gain: 0, B: null };
const LIMIT = () => (S.settings && S.settings.limit) || 60;
const P = () => S.items[S.i];
const rightCount = () => S.items.filter(p => p.result && p.result.correct).length;
const scoreNow = () => (S.items.length ? Math.round(rightCount() * 100 / S.items.length) : 0);
const stageOf = p => AREAS.indexOf(p.area);

/* ---------- 서버 상태 → 화면용 문제 ---------- */
function prepare(it) {
  const v = it.view, p = { pos: it.pos, area: it.area, topic: it.topic, level: it.level, type: it.type, view: v, ui: {}, hintText: it.hint || '', result: it.result || null, elapsed: it.elapsed };
  if (p.type === 'mc' || p.type === 'multi') p.opts = shuffle(v.options);
  if (p.type === 'multi') p.ui.multi = [];
  // 보기 순서는 화면에 띄울 때마다 새로 섞어요 (채점은 보기 '글자'로 해서 순서와 상관없어요)
  if (p.type === 'fill') { p.chips = shuffle(v.chips); p.ui.fill = new Array((v.code.match(/\{\d\}/g) || []).length).fill(null); }
  if (p.type === 'order') { p.blocks = shuffle(v.blocks); p.ui.order = []; }
  if (p.type === 'match') { p.left = shuffle(v.left); p.right = shuffle(v.right); p.ui.match = {}; p.ui.active = null; }
  if (p.type === 'sort') { p.sitems = shuffle(v.items); p.ui.sort = {}; }
  if (p.ui.hint === undefined) p.ui.hint = !!it.hint;
  return p;
}
function loadState(st) {
  S.token = st.token; S.me = { grade: st.grade, cls: st.cls, num: st.num, name: st.name }; S.settings = st.settings;
  S.items = st.items.map(prepare);
  S.combo = 0; S.maxCombo = 0;
  S.items.forEach(p => { if (p.result) { if (p.result.correct) { S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo); } else S.combo = 0; } });
  store.set('quiz_session', { token: st.token, me: S.me });
}

/* ---------- 답 만들기 (서버로 보낼 모양: 보기 '글자') ---------- */
function answered(p) {
  const u = p.ui;
  switch (p.type) {
    case 'ox': case 'mc': case 'bug': case 'imgox': case 'imgpick': return u.pick !== undefined;
    case 'imgspot': return !!u.tap;
    case 'multi': return u.multi.length > 0;
    case 'input': return !!(u.text && u.text.trim());
    case 'fill': return u.fill.every(v => v !== null);
    case 'order': return u.order.length === p.blocks.length;
    case 'match': return Object.keys(u.match).length === p.left.length;
    case 'sort': return Object.keys(u.sort).length === p.sitems.length;
  }
}
function needMsg(p) { return { fill: '빈칸을 모두 채워요.', order: '블록을 모두 쌓아요.', match: '모든 짝을 맞춰요.', sort: '모든 항목을 나눠요.', input: '답을 적어요.', multi: '하나 이상 골라요.', imgspot: '그림에서 한 곳을 눌러요.' }[p.type] || '답을 골라요.'; }
function toAnswer(p) {
  const u = p.ui;
  switch (p.type) {
    case 'multi': return u.multi;
    case 'input': return u.text;
    case 'fill': return u.fill.map(ci => p.chips[ci]);
    case 'order': return u.order.map(i => p.blocks[i]);
    case 'match': return Object.entries(u.match).map(([l, r]) => [p.left[l], p.right[r]]);
    case 'sort': return p.sitems.map((t, i) => [t, u.sort[i]]);
    case 'imgspot': return u.tap;
    default: return u.pick;
  }
}

/* ---------- 타이머 (서버가 잰 시간에 맞춰요) ---------- */
let tick = null;
const remaining = () => Math.max(0, LIMIT() - (Date.now() - S.qStart) / 1000);
function stopTimer() { if (tick) { clearInterval(tick); tick = null; } }
function startTimer() { if (!tick) tick = setInterval(updTimer, 200); updTimer(); }
function updTimer() {
  if (S.screen !== 'quiz' || S.checked || !S.qStart) { stopTimer(); return; }
  const r = remaining(), num = document.getElementById('tnum'), bar = document.getElementById('tbar');
  if (num) { num.textContent = Math.ceil(r); num.classList.toggle('warn', r <= 10); }
  if (bar) { bar.style.width = (r / LIMIT() * 100) + '%'; bar.style.background = r <= 10 ? '#FF5A5F' : r <= 30 ? '#FFD43B' : '#22C55E'; }
  if (r <= 0) finish(true);
}

/* ---------- 화면 ---------- */
let lastView = '';
function render() {
  const fn = { loading: viewLoading, start: viewStart, intro: viewIntro, quiz: viewQuiz, result: viewResult }[S.screen];
  $app.innerHTML = fn();
  const view = S.screen + (S.screen === 'quiz' ? ':' + S.i : ''), isNew = view !== lastView; lastView = view;
  if (isNew && !REDUCED && $app.animate) [...$app.children].forEach((el, k) => el.animate([{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 340, delay: k * 45, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }));
  $dock.innerHTML = S.screen === 'quiz' ? dockQuiz() : '';
  $app.style.paddingBottom = '';
  if (S.screen === 'quiz') { const d = $dock.firstElementChild; if (d) $app.style.paddingBottom = (d.offsetHeight + 16) + 'px'; }
  if (isNew) window.scrollTo(0, 0);
  if (S.screen === 'quiz' && !S.checked && S.qStart) { startTimer(); const inp = document.getElementById('ans'); if (inp && isNew && !TOUCH) inp.focus({ preventScroll: true }); }
  if (!isTyping()) document.body.classList.remove('kb');
  else stopTimer();
  if (S.screen === 'result' && isNew) countUp();
  const fx = S.fx; S.fx = '';
  if (fx === 'ok') { confetti(document.querySelector('.score-pill')); buzz(25); }
  if (fx === 'bad') { const c = $app.querySelector('.card'); if (c && c.animate && !REDUCED) c.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(0)' }], { duration: 360 }); buzz([30, 40, 30]); }
}
const viewLoading = () => `<p class="loading">${esc(S.loadingMsg || '불러오는 중…')}</p>`;

function viewStart() {
  const st = S.settings, m = S.me || (store.get('quiz_session') || {}).me || store.get('quiz_me') || { grade: 1, cls: 1, num: '', name: '' };
  const maxC = g => (st.classes && st.classes[g]) || 12;
  const opt = (n, v, unit) => Array.from({ length: n }, (_, i) => `<option value="${i + 1}"${Number(v) === i + 1 ? ' selected' : ''}>${i + 1}${unit}</option>`).join('');
  return `<div class="toprow" style="margin-top:auto"><span class="pill" data-act="secret">${esc(st.school)} 정보·AI 행사</span><a class="pill dashlink" href="${DASHBOARD_URL}" aria-label="도전하지 않고 순위 대시보드 보기"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V4M16 20v-7M21 20H3" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>순위 보기</a></div>
    <div class="hero"><h1 style="font-size:clamp(40px, 12vw, 54px)"><span class="blue">AI·코딩</span><br>퀴즈 <span class="tag">챌린지</span></h1><img src="${TURTLE}" alt="휴대폰을 든 거북이 캐릭터"></div>
    ${st.isOpen ? '' : '<p class="err" role="alert" style="font-size:18px">지금은 퀴즈 시간이 아니에요. 선생님 안내를 기다려 주세요.</p>'}
    <div class="card stack" style="gap:10px">
      <strong class="ftitle">누가 도전하나요?</strong>
      <div class="three">
        <select class="sel" id="fGrade" aria-label="학년">${opt(3, m.grade, '학년')}</select>
        <select class="sel" id="fCls" aria-label="반">${opt(maxC(m.grade), Math.min(m.cls, maxC(m.grade)), '반')}</select>
        <select class="sel" id="fNum" aria-label="번호"><option value="">번호</option>${opt(40, m.num, '번')}</select>
      </div>
      <input class="sel" id="fName" type="text" autocomplete="off" maxlength="10" placeholder="이름" aria-label="이름" value="${esc(m.name || '')}">
      ${S.err ? `<p class="err pop" role="alert">${esc(S.err)}</p>` : ''}
      <div class="stages">${AREAS.map((a, i) => `<div class="a-${a}"><small>STAGE ${i + 1}</small>${a}</div>`).join('')}</div>
      <div class="rules"><div><b>15문제</b>매번 랜덤</div><div><b>${LIMIT()}초</b>문제마다 제한</div><div><b>힌트</b>막히면 눌러요</div></div>
    </div>
    <button class="btn wide${S.busy ? ' busy' : ''}" data-act="start" id="startBtn">${S.busy ? '준비하는 중…' : '도전 시작!'}</button>
    <p class="note" style="text-align:center;margin:0">첫 도전만 기록돼요. <button class="linkbtn" data-act="tiers" style="display:inline">등급표 보기</button></p>
    <span style="margin-bottom:auto"></span>`;
}

function viewIntro() {
  const p = P(), st = stageOf(p);
  return `<div class="card intro stack pop center">
    <span class="step">STAGE ${st + 1} / ${AREAS.length}</span>
    <span class="name" style="color:${AREA_INFO[p.area].color}">${p.area}</span>
    <span class="lead">${AREA_INFO[p.area].desc}</span>
    ${S.i ? `<span class="lead" style="font-size:18px">지금 점수 <b>${scoreNow()}점</b></span>` : ''}
    <button class="btn wide${S.busy ? ' busy' : ''}" data-act="go" id="goBtn">시작!</button>
  </div>`;
}

function viewQuiz() {
  const p = P(), total = S.items.length, r = S.checked ? 0 : remaining();
  return `<div class="hud">
      <div class="hud-row">
        <span class="qno">문제 ${S.i + 1}<small>/ ${total}</small></span>
        <span class="score-pill" aria-label="현재 점수">점수 <b>${scoreNow()}</b>점</span>
        <span class="timer${S.checked ? ' stop' : ''}" id="tnum" aria-label="남은 시간(초)">${S.checked ? '-' : Math.ceil(r)}</span>
      </div>
      <div class="tbar-row"><div class="tbar"><span id="tbar" style="width:${S.checked ? 0 : r / LIMIT() * 100}%"></span></div>${S.combo >= 2 ? `<span class="combo${S.fx === 'ok' ? ' pop' : ''}">콤보 x${S.combo}</span>` : ''}</div>
      <div class="dots" aria-hidden="true">${S.items.map((x, k) => `<span class="${x.result ? (x.result.correct ? 'o' : 'x') : ''}${k === S.i ? ' cur' : ''}"></span>`).join('')}</div>
    </div>
    <div class="card stack center ${S.checked ? 'locked' : ''}">
      <div class="meta">
        <span class="chip a-${p.area}">${p.area} · ${esc(p.topic)}</span>
        <span class="stars" aria-label="난이도 별 ${p.level}개">${stars(p.level)}</span>
        <span class="kind">${KIND[p.type]}</span>
      </div>
      <p class="qtext">${esc(p.view.q)}</p>
      ${p.view.code && p.type !== 'fill' ? `<pre class="code">${esc(p.view.code)}</pre>` : ''}
      ${answerArea(p)}
      ${p.hintText ? `<div class="hint${S.fx === 'hint' ? ' pop' : ''}">${esc(p.hintText)}</div>` : (S.checked || !p.view.hasHint ? '' : '<button class="hint-btn" data-act="hint">힌트 보기</button>')}
    </div>`;
}

function dockQuiz() {
  const p = P(), last = S.i === S.items.length - 1;
  if (!S.checked) return `<div class="dock"><div class="dock-in">${S.err ? `<p class="err pop" role="alert">${esc(S.err)}</p>` : ''}<button class="btn wide${S.busy ? ' busy' : ''}" data-act="check" id="checkBtn">${S.busy ? '채점 중…' : '확인'}</button></div></div>`;
  const r = p.result, ok = r.correct;
  const title = ok ? (S.combo >= 2 ? `정답! 콤보 x${S.combo}` : '정답!') : r.timeout ? '시간 초과!' : '아쉬워요!';
  return `<div class="dock sheet ${ok ? 'good' : 'badf'}" role="status"><div class="dock-in">
    <span class="big pop">${title}${ok ? ` <span style="font-size:22px">+${S.gain}점</span>` : ''}</span>
    ${ok ? '' : `<span class="ans">정답: ${esc(r.answerText)}</span>`}
    ${r.why ? `<span class="why">${esc(r.why)}</span>` : ''}
    <button class="btn wide${S.busy ? ' busy' : ''}" data-act="next" id="nextBtn">${last ? (S.busy ? '기록하는 중…' : '결과 보기') : '다음 문제'}</button>
  </div></div>`;
}

/* 답한 뒤 색칠: 서버가 준 정답(key)과 비교 */
function mark(isRight, isPicked) { if (!S.checked) return ''; if (isRight) return ' is-ok'; if (isPicked) return ' is-bad'; return ''; }
function answerArea(p) {
  const u = p.ui, v = p.view, key = S.checked && p.result ? p.result.key : null;
  const pic = src => `<img src="${esc(src)}" alt="문제 그림" draggable="false">`;
  const zoom = `<button class="zoombtn" data-act="zoom" type="button"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M15 15l6 6M10 7v6M7 10h6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>그림 크게 보기</button>`;
  switch (p.type) {
    case 'ox': case 'imgox':
      return `${p.type === 'imgox' ? `<div class="pic">${pic(v.img)}</div>${zoom}` : ''}<div class="opts ox">${['O', 'X'].map(k => `<button class="opt${mark(k === key, u.pick === k)}" data-act="pick" data-v="${k}" aria-pressed="${u.pick === k}"${p.type === 'imgox' ? ' style="min-height:76px;font-size:44px"' : ''}>${k}</button>`).join('')}</div>`;
    case 'imgspot': {
      const rects = key ? (Array.isArray(key[0]) ? key : [key]) : [];   // 정답 영역 1~2개
      return `<div class="pic spot" data-act="tap" role="button" aria-label="그림에서 수상한 곳 누르기">${pic(v.img)}${rects.map(sp => `<span class="spotbox" style="left:${sp[0]}%;top:${sp[1]}%;width:${sp[2]}%;height:${sp[3]}%"></span>`).join('')}${u.tap ? `<span class="tapmark${S.checked ? (p.result.correct ? ' ok' : ' no') : ''}" style="left:${u.tap.x}%;top:${u.tap.y}%"></span>` : ''}</div><p class="help" style="text-align:center">${u.tap ? '다른 곳을 누르면 다시 고를 수 있어요.' : '그림에서 수상한 곳을 손가락으로 눌러요. 작아서 안 보이면 크게 보기!'}</p>${zoom}`;
    }
    case 'imgpick':
      return `${zoom}<div class="pics">${v.imgs.map((src, i) => `<button class="opt pk${mark(i === key, u.pick === i)}" data-act="pick" data-v="${i}" aria-pressed="${u.pick === i}">${pic(src)}<span>${'AB'[i]}</span></button>`).join('')}</div>`;
    case 'mc':
      return `<div class="opts">${p.opts.map((o, k) => `<button class="opt${mark(o === key, u.pick === o)}" data-act="pick" data-k="${k}" aria-pressed="${u.pick === o}"><span class="box round"></span>${esc(o)}</button>`).join('')}</div>`;
    case 'multi':
      return `<p class="help">정답이 여러 개일 수 있어요.</p><div class="opts">${p.opts.map((o, k) => { const on = u.multi.includes(o); return `<button class="opt${mark(key && key.includes(o), on)}" data-act="multi" data-k="${k}" aria-pressed="${on}"><span class="box"></span>${esc(o)}</button>`; }).join('')}</div>`;
    case 'input':
      return `<label class="help" for="ans">답을 적고 확인을 눌러요</label><div class="ansrow"><input class="answer${S.checked ? (p.result.correct ? ' is-ok' : ' is-bad') : ''}" id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="${esc(v.placeholder || '')}" value="${esc(u.text || '')}" ${S.checked ? 'readonly' : ''}>${S.checked ? '' : '<button class="btn kbgo" data-act="check" type="button">확인</button>'}</div>`;
    case 'fill': {
      const parts = v.code.split(/(\{\d\})/).map(seg => {
        const m = seg.match(/^\{(\d)\}$/);
        if (!m) return esc(seg);
        const i = Number(m[1]), ci = u.fill[i];
        const ok = key ? (ci !== null && p.chips[ci] === key[i] ? ' is-ok' : ' is-bad') : '';
        return `<button class="blank${ci !== null ? ' filled' : ''}${ok}" data-act="unfill" data-v="${i}" aria-label="빈칸 ${i + 1}">${ci !== null ? esc(p.chips[ci]) : '?'}</button>`;
      }).join('');
      const used = new Set(u.fill.filter(x => x !== null));
      return `<pre class="code" style="${v.plain ? 'font-family:var(--body);white-space:pre-wrap' : ''}">${parts}</pre>
        <p class="help">블록을 누르면 앞 빈칸부터 채워져요. 빈칸을 누르면 빠져요.</p>
        <div class="toks">${p.chips.map((c, k) => `<button class="tok${v.plain ? ' word' : ''}" data-act="fill" data-v="${k}" ${used.has(k) ? 'disabled' : ''}>${esc(c)}</button>`).join('')}</div>`;
    }
    case 'order': {
      const tc = v.text_blocks ? ' text' : '';
      const slot = u.order.length
        ? u.order.map((idx, n) => `<button class="blk${tc}${key ? (p.blocks[idx] === key[n] ? ' is-ok' : ' is-bad') : ''}" data-act="unorder" data-v="${n}"><b>${n + 1}</b>${esc(p.blocks[idx])}</button>`).join('')
        : '<span class="ph">순서대로 눌러서 여기에 쌓아요</span>';
      const left = p.blocks.map((t, idx) => ({ t, idx })).filter(b => !u.order.includes(b.idx));
      return `<div class="slot">${slot}</div>${left.length ? `<div class="pool">${left.map(b => `<button class="blk${tc}" data-act="order" data-v="${b.idx}">${esc(b.t)}</button>`).join('')}</div>` : ''}`;
    }
    case 'match': {
      const order = Object.keys(u.match).map(Number), no = l => order.indexOf(l);
      const dot = n => n >= 0 ? `<span class="dot" style="background:${PAIR_COLORS[n % PAIR_COLORS.length]}">${n + 1}</span>` : '<span class="dot"></span>';
      const ownerOf = r => { const l = Object.keys(u.match).find(k => u.match[k] === r); return l === undefined ? -1 : Number(l); };
      const good = key ? new Set(key.map(pr => pr[0] + '\u001f' + pr[1])) : null;
      const okPair = l => good && u.match[l] !== undefined && good.has(p.left[l] + '\u001f' + p.right[u.match[l]]);
      let cells = '';
      for (let k = 0; k < p.left.length; k++) {
        const ro = ownerOf(k);
        cells += `<button class="side${v.code_left ? ' code' : ''}${u.active === k ? ' active' : ''}${good ? (okPair(k) ? ' is-ok' : ' is-bad') : ''}" data-act="mleft" data-v="${k}" aria-pressed="${u.active === k}">${dot(no(k))}<span>${esc(p.left[k])}</span></button>`;
        cells += `<button class="side${good ? (ro >= 0 && okPair(ro) ? ' is-ok' : ' is-bad') : ''}" data-act="mright" data-v="${k}">${dot(ro >= 0 ? no(ro) : -1)}<span>${esc(p.right[k])}</span></button>`;
      }

    case 'unorder': u.order.splice(Number(v), 1); break;
    case 'mleft': { const n = Number(v); if (u.match[n] !== undefined) { delete u.match[n]; u.active = null; } else u.active = u.active === n ? null : n; break; }
    case 'mright': {
      const r = Number(v), owner = Object.keys(u.match).find(l => u.match[l] === r);
      if (u.active === null) { if (owner !== undefined) delete u.match[owner]; break; }
      if (owner !== undefined) delete u.match[owner];
      u.match[u.active] = r; u.active = null; break;
    }
    case 'sort': u.sort[Number(v)] = Number(b.dataset.b); break;
  }
  render();
}
[$app, $dock].forEach(el => el.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) onAct(b, e); }));
$layer.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b) return; if (b.classList.contains('modal') && e.target !== b) return; onAct(b, e); });
$app.addEventListener('input', e => { if (e.target.id === 'ans' && P()) P().ui.text = e.target.value; });

/* ---------- 숨은 관리자 입구 ----------
   시작 화면의 학교 이름 배지를 2초 안에 5번 누르면 관리자 페이지로 가요. (비밀번호는 거기서 따로 물어봐요) */
let secretTaps = [];
function secretTap() {
  const now = Date.now(); secretTaps = secretTaps.filter(t => now - t < 2000).concat(now);
  if (secretTaps.length >= 5) { secretTaps = []; location.href = 'admin.html'; }
}

/* ---------- 휴대폰 키보드가 문제를 가리지 않게 ----------
   키보드가 올라오면(입력칸에 손가락을 대면) body에 kb 표시를 붙여요.
   kb일 때: 아래 확인 바는 숨기고 입력칸 옆 확인 버튼을 보여 주고, 위 정보줄도 얇게 줄여요.
   그리고 입력칸 아래쪽이 키보드 바로 위에 오도록 화면을 올려서, 그 위의 문제와 코드가 최대한 보이게 해요. */
const TOUCH = matchMedia('(pointer: coarse)').matches, VV = window.visualViewport;
function isTyping() { const a = document.activeElement; return !!a && a.tagName === 'INPUT' && $app.contains(a) && !a.readOnly; }
function fitKeyboard() {
  if (!isTyping()) return;
  const el = document.activeElement, row = el.closest('.ansrow') || el;
  const seeTop = VV ? VV.offsetTop : 0, seeH = VV ? VV.height : innerHeight;
  const gap = row.getBoundingClientRect().bottom - (seeTop + seeH - 12);   // 양수면 입력칸이 키보드 밑에 있어요
  if (Math.abs(gap) > 4) window.scrollBy(0, gap);
}
let kbTimer = 0;
$app.addEventListener('focusin', e => {
  if (!isTyping()) return;
  clearTimeout(kbTimer); document.body.classList.add('kb');
  [60, 320, 650].forEach(ms => setTimeout(fitKeyboard, ms));   // 키보드가 올라오는 속도가 휴대폰마다 달라요
});
$app.addEventListener('focusout', () => { kbTimer = setTimeout(() => { if (!isTyping()) document.body.classList.remove('kb'); }, 200); });
if (VV) VV.addEventListener('resize', () => { if (document.body.classList.contains('kb')) fitKeyboard(); });
// 입력칸 옆 확인 버튼을 눌러도 키보드가 먼저 내려가지 않게(눌렀을 때 화면이 흔들리지 않게)
$app.addEventListener('pointerdown', e => { if (e.target.closest('.kbgo')) e.preventDefault(); });
$app.addEventListener('mousedown', e => { if (e.target.closest('.kbgo')) e.preventDefault(); });
$app.addEventListener('keydown', e => { if (e.target.id === 'ans' && e.key === 'Enter') { e.preventDefault(); finish(false); } if (e.target.id === 'fName' && e.key === 'Enter') { e.preventDefault(); submitWho(); } });
$app.addEventListener('change', e => {
  if (e.target.id !== 'fGrade') return;
  const c = document.getElementById('fCls'), max = (S.settings.classes && S.settings.classes[e.target.value]) || 12, cur = Math.min(Number(c.value), max);
  c.innerHTML = Array.from({ length: max }, (_, i) => `<option value="${i + 1}"${cur === i + 1 ? ' selected' : ''}>${i + 1}반</option>`).join('');
});

/* ---------- 시작 ---------- */
(async function boot() {
  demoRibbon();
  try { S.settings = await rpc('quiz_info'); }
  catch (e) { $app.innerHTML = `<div class="card stack center"><strong class="ftitle">연결할 수 없어요</strong><p>${esc(e.message)}</p><button class="btn wide" onclick="location.reload()">다시 시도</button></div>`; return; }
  const sess = store.get('quiz_session');
  if (sess && sess.me && sess.me.name) {   // 새로고침·다시 열기 → 이어서
    try { await enter(await rpc('quiz_start', { p_grade: sess.me.grade, p_cls: sess.me.cls, p_num: sess.me.num, p_name: sess.me.name })); return; }
    catch (e) { store.del('quiz_session'); }
  }
  S.screen = 'start'; render();
})();
</script>
